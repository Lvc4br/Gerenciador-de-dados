name: GED desktop CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python-indexer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install indexer and test dependencies
        working-directory: services/indexer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run indexer tests
        working-directory: services/indexer
        run: pytest -q

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install Rust build prerequisites
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Run Rust backend tests
        working-directory: apps/desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows desktop installers
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: ged-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
