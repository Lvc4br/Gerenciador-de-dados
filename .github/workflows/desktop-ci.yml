name: GED desktop CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  python-indexer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install indexer and test dependencies
        working-directory: services/indexer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run indexer tests
        working-directory: services/indexer
        run: pytest -q

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Install Rust build prerequisites
        run: rustup target add x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check Tauri native application
        working-directory: apps/desktop/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc
